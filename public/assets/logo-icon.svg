<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo icon apenas (sem texto) -->
  <g id="logo-icon">
    <!-- Linhas de conexão -->
    <line x1="10" y1="20" x2="16" y2="20" stroke="url(#iconGrad1)" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="20" x2="30" y2="20" stroke="url(#iconGrad1)" stroke-width="2" stroke-linecap="round"/>

    <!-- Círculo esquerdo -->
    <circle cx="8" cy="20" r="5" fill="url(#iconGrad1)"/>
    <circle cx="8" cy="20" r="2.5" fill="#0a0a0a" opacity="0.9"/>

    <!-- Círculo central (maior, representa o "foco") -->
    <circle cx="20" cy="20" r="7" fill="url(#iconGrad2)"/>
    <circle cx="20" cy="20" r="3.5" fill="#0a0a0a" opacity="0.9"/>

    <!-- Círculo direito -->
    <circle cx="32" cy="20" r="5" fill="url(#iconGrad3)"/>
    <circle cx="32" cy="20" r="2.5" fill="#0a0a0a" opacity="0.9"/>

    <!-- Aura de luz -->
    <circle cx="20" cy="20" r="10" stroke="url(#iconGrad2)" stroke-width="1" opacity="0.3"/>
    <circle cx="20" cy="20" r="14" stroke="url(#iconGrad2)" stroke-width="0.5" opacity="0.15"/>
  </g>

  <defs>
    <linearGradient id="iconGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
    <linearGradient id="iconGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#00ff7f"/>
    </linearGradient>
    <linearGradient id="iconGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff7f"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
  </defs>
</svg>
